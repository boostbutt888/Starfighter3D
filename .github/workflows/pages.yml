name: Test and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gameplay regression checks
        run: npm test
      - name: Package the static game
        run: npm run build
      - name: Checkout Mission 03 preview branch
        uses: actions/checkout@v6
        with:
          ref: cabdc6ff2b140c0d2688d0a7a67b4ba7574e13f9
          path: mission-preview
      - name: Test Mission 03 preview
        working-directory: mission-preview
        run: npm test
      - name: Package Mission 03 preview
        working-directory: mission-preview
        run: npm run build
      - name: Add separate preview without replacing main game
        run: cp -R mission-preview/dist dist/preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
