<!doctype html><meta charset="utf-8"><title>Starfighter audio verification</title><style>body{background:#10202b;color:#eee;font:16px sans-serif;padding:40px}button{padding:16px;margin:8px}pre{line-height:1.6}</style><h1>Orchestral audio verification</h1><p>Loads the production instrument samples and runs the final approach into the boss arrangement.</p><button id="run">Play approach and boss cue</button><button id="mute">Toggle effects</button><pre id="status">Ready for a user gesture.</pre><script type="module">
import {FlightAudio} from '../audio.js';
const audio=new FlightAudio();let active=false,start=0;const status=document.getElementById('status');document.getElementById('run').onclick=async()=>{try{await audio.unlock();active=true;start=performance.now();audio.beat=0;}catch(e){status.textContent='FAIL '+e.message}};document.getElementById('mute').onclick=()=>audio.effectsEnabled=!audio.effectsEnabled;let lastShot=0;function tick(){requestAnimationFrame(tick);if(!active)return;let elapsed=53+(performance.now()-start)/1000;audio.update('playing',elapsed,elapsed>=67);if(performance.now()-lastShot>3500){audio.laser(elapsed%2<1);lastShot=performance.now()}status.textContent=JSON.stringify({elapsed:elapsed.toFixed(1),...audio.diagnostics},null,2)}tick();
</script>
