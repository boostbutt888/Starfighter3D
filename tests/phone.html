<!doctype html><html><head><meta charset="utf-8"><title>Starfighter · Phone layout check</title><style>*{box-sizing:border-box}body{margin:0;background:#19222d;color:#e7e5dd;font:12px sans-serif}nav{height:48px;padding:8px;display:flex;gap:8px;align-items:center}button{background:#28394b;color:#eee;border:1px solid #758494;padding:8px;cursor:pointer}#stage{height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;overflow:hidden}#frame{border:1px solid #9cabb7;flex-shrink:0;transform-origin:center}#size{margin-left:auto}</style></head><body><nav><button data-size="844,390">Phone 844 × 390</button><button data-size="667,375">Small phone 667 × 375</button><button data-size="390,844">Portrait</button><button data-action="start">Launch</button><button data-action="trench">Trench</button><button data-action="tatooine">Tatooine</button><button data-action="phoneView">Controls preview</button><button data-action="fullscreenHelp">iPhone full-screen help</button><button data-action="scrape">Scrape preview</button><span id="size"></span></nav><div id="stage"><iframe id="frame" title="Phone game preview" src="mission.html?phone=1&v=10c" allow="autoplay;fullscreen"></iframe></div><script>const frame=document.getElementById('frame');let width=844,height=390;function fit(){frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+Math.min(1,(innerWidth-20)/width,(innerHeight-68)/height)+')';document.getElementById('size').textContent=width+' × '+height}for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{[width,height]=b.dataset.size.split(',').map(Number);fit()};for(const b of document.querySelectorAll('[data-action]'))b.onclick=()=>frame.contentWindow.postMessage({qaAction:b.dataset.action},location.origin);window.onresize=fit;fit();</script></body></html>
